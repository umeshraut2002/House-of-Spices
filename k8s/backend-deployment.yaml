apiVersion: apps/v1
kind: Deployment
metadata: 
  name: house-of-spices-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: house-of-spices-app
  template:
    metadata:
      labels:
        app: house-of-spices-app
    spec:
      containers:
        - name: house-of-spices
          image: nginx:1.28
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            linits:
              cpu: "500m"
              memory: "256Mi"
            volumeMounts:
              - name: house-of-spices-storage
                path: /usr/share/nginx/html
          volumes:
            
apiVersion: apps/v1
kindi: Deployment
metadata:
  name: web-app
spec: 
  replicas: 4
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
    containers:
      - name: web
        image: nginx:1.28
        ports:
          - containerPort: 80
        resources:
          requests: 
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256"
        volumeMounts:
          - name: web-storage
            path: /usr/share/nginx/html 
    volumes:
      name: web-storage
      persistentVolumeClaim:
        name: web-app-pvc 



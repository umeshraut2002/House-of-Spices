apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: web-app
spec:
  replicas: 3 
  selector:
    metadata:
      maatchLabels:
        app: web-app
    template:
      metadata:
        labels:
          app: web-app
      spec:
        - containers:
            - name: web
              image: nginx:1.28
              ports:
                - containerPort: 80
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
                  
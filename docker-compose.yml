services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: masalewala
      MYSQL_USER: masala
      MYSQL_PASSWORD: masala_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["3306:3306"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/masalewala
      DB_USERNAME: masala
      DB_PASSWORD: masala_pass
      JWT_SECRET: change-me-change-me-change-me-change-me
      UPI_ID: pay@masalewala
      CORS_ORIGIN: http://localhost
      S3_BUCKET: masale-wala-assets
    depends_on: [mysql]
    ports: ["8080:8080"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on: [backend]
    ports: ["80:80"]
volumes: { mysql-data: {} }

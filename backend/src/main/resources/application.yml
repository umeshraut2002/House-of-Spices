server: { port: 8080 }
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:masalewala;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate: { ddl-auto: update }
    open-in-view: false
  servlet:
    multipart: { max-file-size: 8MB, max-request-size: 10MB }
app:
  jwt-secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  upi-id: ${UPI_ID:pay@masalewala}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
aws:
  s3-bucket: ${S3_BUCKET:masale-wala-assets}
